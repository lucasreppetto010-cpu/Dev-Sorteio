<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Dev Sorteio</title>

</head>


<body>

    <main>
        <label class="logo-container">

            <img src="./assets/logo.png" alt="logo-dev-sorteio">


        </label>



        <section class="sorteador-container">
            <p>Sortear um <b>número</b></p>

            <input type="number" class="input-numbers" placeholder="entre">
            <input type="number" class="input-number" placeholder="e">

        </section>

        <div>
            <button onclick="generateNumber()">Sortear</button>
        </div>


        <div class="resultado-container" id="resultado-container" style="display: none;">
            <p class="resultado-texto">O número sorteado é:</p>
            <h2 class="numero-resultado" id="numero-resultado">-</h2>
        </div>


    </main>







</body>


<script src="./script.js"></script>

</html>
